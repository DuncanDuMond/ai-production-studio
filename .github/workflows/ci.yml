name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDIO_ENABLE_LIVE: "false"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      STUDIO_OTLP_ENDPOINT: ""
      OTEL_SDK_DISABLED: "true"
      HAYSTACK_TELEMETRY_ENABLED: "false"
      DEEPEVAL_TELEMETRY_OPT_OUT: "true"
      RAGAS_DO_NOT_TRACK: "true"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.15
      - name: Install only locked runtime and test dependencies
        run: uv sync --locked
      - name: Unit and deployment regression tests (no service credentials)
        run: uv run --locked pytest -q tests deploy
      - name: Lint
        run: uv run --locked ruff check .
      - name: Offline deployment policy validation
        run: uv run --locked python scripts/check_deploy.py
      - name: Compose parser validation only (no image pulls or containers)
        env:
          OPENAI_API_KEY: "ci-static-placeholder-not-a-provider-key"
          LITELLM_PROVIDER_MODEL: "openai/ci-static-model"
          PHOENIX_API_KEY: "ci-static-placeholder-not-a-phoenix-key"
        run: |
          python deploy/generate_env.py --output "$RUNNER_TEMP/studio.env"
          docker compose --env-file "$RUNNER_TEMP/studio.env" \
            -f deploy/compose.yml -f deploy/compose.proxy.yml \
            -f deploy/compose.phoenix.yml -f deploy/compose.langfuse.yml \
            -f deploy/compose.telemetry-both.yml --profile '*' config --quiet
          rm "$RUNNER_TEMP/studio.env"
      - name: Dependency vulnerability gate (known advisories are not suppressed)
        if: ${{ always() }}
        run: uv run --locked pip-audit --progress-spinner off
