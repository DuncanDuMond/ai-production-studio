[project]
name = "ai-production-studio"
version = "0.1.0"
description = "Local-first AI production workbench: retrieval, agents, validation, evaluations and observability."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  # Patched 1.x supports OpenAI 2.x shared with Guardrails; patched 2.x needs OpenAI 3.x.
  "pydantic-ai-slim[openai]>=1.107.7,<2",
  "instructor>=1.7,<2",
  "litellm>=1.60,<2",
  "guardrails-ai>=0.6,<1",
  "haystack-ai>=2.10,<3",
  "ragas>=0.3,<1",
  # Ragas 0.4.3 imports vertexai, removed from langchain-community 0.4.2.
  "langchain-community==0.4.1",
  "deepeval>=3,<4",
  "langfuse>=3,<4",
  "arize-phoenix-otel>=0.13,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:The 'default' parameter is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false
# CVE-2026-101918: do not resolve the vulnerable PyJWT payload parser again.
constraint-dependencies = ["pyjwt>=2.15.1", "aiohttp>=3.14.4"]
