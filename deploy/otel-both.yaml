# Local-only, opt-in deployment. See docs/DEPLOYMENT.md.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlphttp/phoenix:
    traces_endpoint: http://phoenix:6006/v1/traces
    headers:
      Authorization: Bearer ${env:PHOENIX_API_KEY}
    sending_queue:
      enabled: true
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
  otlphttp/langfuse:
    traces_endpoint: http://langfuse-web:3000/api/public/otel/v1/traces
    headers:
      Authorization: Basic ${env:LANGFUSE_BASIC_AUTH}
      x-langfuse-ingestion-version: '4'
    sending_queue:
      enabled: true
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - otlphttp/phoenix
      - otlphttp/langfuse
