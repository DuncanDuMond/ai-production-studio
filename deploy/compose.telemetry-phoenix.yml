# Local-only, opt-in deployment. See docs/DEPLOYMENT.md.
services:
  collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.160.0@sha256:e495787f07dbe432ce763ebaf5bc3d113850e9eee2250ade7a3da6a882d0d69a
    profiles:
    - telemetry
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - --config=/etc/otelcol/config.yaml
    environment:
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:?Set PHOENIX_API_KEY in the private .env
        file}
    volumes:
    - ./otel-phoenix.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - 127.0.0.1:4318:4318
    read_only: true
    cap_drop:
    - ALL
